<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sakhi AI — Offline</title>
  <meta name="theme-color" content="#ec4899" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .container { max-width: 360px; }
    .icon {
      width: 80px; height: 80px;
      margin: 0 auto 2rem;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec4899, #be185d);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 800; color: white;
      box-shadow: 0 0 40px rgba(236,72,153,0.3);
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: #94a3b8; line-height: 1.6; margin-bottom: 1.5rem; }
    .pulse {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #ef4444;
      margin: 0 auto 1rem;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
      50% { opacity: 0.8; box-shadow: 0 0 0 8px rgba(239,68,68,0); }
    }
    .retry-btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #ec4899;
      color: white;
      border: none;
      border-radius: 9999px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .retry-btn:hover { background: #db2777; }
    .emergency {
      margin-top: 2rem;
      padding: 1rem;
      border-radius: 12px;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.2);
    }
    .emergency p { color: #fca5a5; margin: 0; font-size: 0.875rem; }
    .emergency strong { color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">AI</div>
    <div class="pulse"></div>
    <h1>You're Offline</h1>
    <p>Sakhi AI needs an internet connection for real-time safety features. Your emergency services may be limited while offline.</p>
    <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
    <div class="emergency">
      <p><strong>Emergency?</strong> Dial <strong>112</strong> directly from your phone's dialer — no internet required.</p>
    </div>
  </div>
</body>
</html>
